# Run from the repository root. Replace checkpoint/data/verifier fields.
model: NousResearch/Llama-2-7b-hf
base_model_repo: NousResearch/Llama-2-7b-hf
fingerprint_model_repo: cnut1648/LLaMA2-7B-fingerprinted-SFT
if_upstream_repo: https://github.com/CAU-ISS-Lab/LLM-Fingerprint-and-Attacks
if_query_url: https://raw.githubusercontent.com/CAU-ISS-Lab/LLM-Fingerprint-and-Attacks/main/imf_ptq/TFA_SVA/Fingerprint_dataset/IF/test_IF_total.jsonl
clean_checkpoint: checkpoints/clean
fingerprinted_checkpoint: checkpoints/if-sft-official
tokenizer: NousResearch/Llama-2-7b-hf
tokenizer_revision: null
dtype: bfloat16
device: cuda:0
output_root: outputs
seeds: [42, 43, 44]
group_size: 128
symmetric: true
zero_point: false
# Exact shared calibration token-data provenance for AWQ export.
calibration_dataset: wikitext2-train
calibration_sample_count: 128
calibration_sequence_length: 2048
calibration_sha256: null
calibration: data/calibration.txt
upstream_ptq_repo: ../imf-tier0-ptq
upstream_ptq_repo_url: https://github.com/HuyL13/imf-tier0-ptq.git
queries: data/if_queries.jsonl
normal_queries: data/matched_normal_queries.jsonl
utility_corpus: data/heldout.txt
ppl_sequence_length: 2048
ppl_datasets: [wikitext2]
ppl_cache_dir: .cache/ppl
max_prompt_length: 2048
prompt_mode: raw
add_special_tokens: true
matching_length_tolerance: 0.25
top_layers: 3
sample_limit: 4096
# Explicitly copy the original IF generation configuration here.
# No decoding defaults are injected by this package.
generation:
  do_sample: true
  top_k: 50
  top_p: 0.85
  temperature: 0.7
  repetition_penalty: 1.0
  max_new_tokens: 20
verification:
  callable: phase1.if_sft_verifier:verify
  settings: {}
