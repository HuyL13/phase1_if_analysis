[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase1-if-analysis"
version = "0.1.0"
description = "Mechanism analysis of quantization-induced degradation in IF fingerprinting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.46,<5", "accelerate>=0.26", "safetensors>=0.4", "sentencepiece"]
test = ["pytest>=8"]

[project.scripts]
phase1 = "phase1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
